<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 美发沙龙管家台 · Hair Salon</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f6f2fb; color:#14232b; }
  header { background:linear-gradient(135deg,#5b3a8f,#9b6bd3); color:#fff; padding:18px 28px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; }
  header .sub { font-size:12px; opacity:.85; margin-top:4px; }
  header .badge { font-size:13px; background:rgba(255,255,255,.15); padding:6px 14px; border-radius:20px; }
  main { display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px 20px; max-width:1240px; margin:0 auto; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .card { background:#fff; border-radius:12px; padding:16px 18px; box-shadow:0 1px 4px rgba(91,58,143,.10); }
  .card h2 { font-size:15px; margin-bottom:12px; color:#5b3a8f; }
  .stat { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .stat div { background:#ece4f6; border-radius:10px; padding:12px; }
  .stat b { display:block; font-size:22px; color:#6d4bb0; margin-top:4px; }
  .stat span { font-size:12px; color:#8a7ba3; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; }
  .tag.g { background:#e3f4e9; color:#218a58; }
  .tag.y { background:#fdf3e0; color:#c07f16; }
  .tag.r { background:#fdeaea; color:#c74a44; }
  .tag.b { background:#e7f0fb; color:#2e5fa3; }
  .it { border:1px solid #ddd2ec; border-radius:10px; padding:10px 14px; margin-bottom:10px; }
  .it .top { display:flex; justify-content:space-between; margin-bottom:4px; }
  .it b { color:#5b3a8f; font-size:13.5px; }
  .it .meta { font-size:12.5px; color:#4d6673; line-height:1.7; }
  .ai-panel { position:sticky; top:16px; display:flex; flex-direction:column; height:calc(100vh - 32px); background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(91,58,143,.10); }
  .ai-head { background:linear-gradient(135deg,#5b3a8f,#9b6bd3); color:#fff; padding:14px 16px; }
  .ai-head b { font-size:15px; }
  .ai-head .sub { font-size:11px; opacity:.85; margin-top:3px; }
  .ai-body { flex:1; overflow-y:auto; padding:14px; font-size:13.5px; line-height:1.75; }
  .ai-body .msg { margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
  .ai-body .msg.user { background:#ece4f6; border-radius:10px 10px 2px 10px; padding:8px 12px; margin-left:24px; color:#14232b; }
  .chips { padding:8px 14px; display:flex; flex-wrap:wrap; gap:6px; border-top:1px solid #e6ddf2; }
  .chip { font-size:12px; background:#ece4f6; color:#5b3a8f; border:none; border-radius:14px; padding:5px 10px; cursor:pointer; }
  .chip:hover { background:#d5c5ec; }
  .ai-input { display:flex; gap:8px; padding:10px 14px; border-top:1px solid #e6ddf2; }
  .ai-input input { flex:1; border:1px solid #b5d0dc; border-radius:8px; padding:9px 12px; font-size:13px; outline:none; }
  .ai-input input:focus { border-color:#9b6bd3; }
  .ai-input button { background:#9b6bd3; color:#fff; border:none; border-radius:8px; padding:0 18px; font-size:13px; cursor:pointer; }
  .ai-input button:disabled { background:#7db9c9; }
</style>
</head>
<body>
<header>
  <div>
    <h1>💇 AI 美发沙龙管家台</h1>
    <div class="sub">价目 · 发型师 · 预约 · 统计 | 连锁美发云平台</div>
  </div>
  <div class="badge" id="topBadge">加载中…</div>
</header>
<main>
  <div class="col">
    <div class="card">
      <h2>运营看板</h2>
      <div class="stat" id="stats"></div>
    </div>
    <div class="card">
      <h2>美发价目</h2>
      <div id="services"></div>
    </div>
    <div class="card">
      <h2>最新预约</h2>
      <div id="recent"></div>
    </div>
  </div>
  <div class="ai-panel">
    <div class="ai-head">
      <b>💇 AI 美发沙龙管家</b>
      <div class="sub">salon-copilot · 价目 / 发型师 / 预约 / 统计</div>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="chips">
      <button class="chip" onclick="ask('有哪些美发项目和价格？')">服务价目</button>
      <button class="chip" onclick="ask('有哪些发型师？擅长什么？')">发型师查询</button>
      <button class="chip" onclick="ask('帮我预约精剪造型，周四 15:00，吴先生 13800007777，确认无误直接办理')">预约下单</button>
      <button class="chip" onclick="ask('查一下预约 H1001 的状态')">预约查询</button>
      <button class="chip" onclick="ask('今天运营情况怎么样？')">运营看板</button>
    </div>
    <div class="ai-input">
      <input id="q" placeholder="例如：烫发多少钱？；帮我预约染发，周五 14:00，钱女士" onkeydown="if(event.key==='Enter')send()">
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</main>
<script>
const j = r => Promise.resolve(r).then(resp => resp.json()).then(d => d.data ?? d);
async function load() {
  try {
    const st = await j(fetch('/api/stats'));
    document.getElementById('topBadge').textContent = `预约 ${st.totalBookings} · 营收 ¥${st.revenue}`;
    document.getElementById('stats').innerHTML = `
      <div><span>总单量</span><b>${st.totalBookings}</b></div>
      <div><span>待到店</span><b>${st.upcoming}</b></div>
      <div><span>已完成</span><b>${st.done}</b></div>
      <div><span>营收</span><b>¥${st.revenue}</b></div>`;
    const ps = await j(fetch('/api/services'));
    document.getElementById('services').innerHTML = (ps.services || ps).map(p => `
      <div class="it">
        <div class="top"><b>${p.service}</b><span class="tag g">¥${p.price}</span></div>
        <div class="meta">约 ${p.minutes} 分钟 · ${p.desc}</div>
      </div>`).join('');
    document.getElementById('recent').innerHTML = `
      <div class="it">
        <div class="top"><b>H1001 · 周先生</b><span class="tag y">已预约</span></div>
        <div class="meta">精剪造型 · 发型师 阿凯 · 周三 14:00 · ¥68</div>
      </div>
      <div class="it">
        <div class="top"><b>H1002 · 钱女士</b><span class="tag b">进行中</span></div>
        <div class="meta">染发 · 发型师 小雅 · 周三 16:00 · ¥298</div>
      </div>
      <div class="it">
        <div class="top"><b>H1003 · 何女士</b><span class="tag g">已完成</span></div>
        <div class="meta">头皮护理 · 发型师 大伟 · 周二 11:00 · ¥158</div>
      </div>`;
  } catch(e) { console.error(e); }
}
function ask(t) { const q=document.getElementById('q'); q.value=t; send(); }
async function send() {
  const inp = document.getElementById('q'), btn = document.getElementById('sendBtn');
  const text = inp.value.trim(); if (!text || btn.disabled) return;
  inp.value = ''; btn.disabled = true;
  const body = document.getElementById('aiBody');
  const u = document.createElement('div'); u.className = 'msg user'; u.textContent = text; body.appendChild(u);
  const a = document.createElement('div'); a.className = 'msg'; a.textContent = '…'; body.appendChild(a);
  try {
    const resp = await fetch('/api/assistant/stream', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text}) });
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '', out = '';
    for (;;) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        for (const line of p.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const dstr = line.slice(5).trim(); if (!dstr || dstr === '[DONE]') continue;
          try {
            const d = JSON.parse(dstr);
            const piece = d.content ?? d.delta ?? '';
            if (typeof piece === 'string' && piece) { out += piece; a.textContent = out; body.scrollTop = body.scrollHeight; }
          } catch(e) {}
        }
      }
    }
    if (!out) a.textContent = '（无返回内容）';
  } catch(e) { a.textContent = 'AI 服务暂时不可用：' + e.message; }
  btn.disabled = false; body.scrollTop = body.scrollHeight;
}
load();
</script>
</body>
</html>
